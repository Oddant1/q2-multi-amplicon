[project]
name = "q2-multi-amplicon"
authors = [
    { name = "Oddant1", email = "oddant1@hotmail.com"}
]
description = "Multi-amplicon workflows."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = ["version"]

[project.urls]
Homepage = "https://example.com/q2-multi-amplicon"

[project.entry-points.'qiime2.plugins']
"q2-multi-amplicon" = "q2_multi_amplicon.plugin_setup:plugin"

[build-system]
requires = [
    "setuptools",
    "versioningit",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe:tags)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "q2_multi_amplicon/_version.py"

[tool.versioningit]
default-version = "0.0.dev0"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["q2_multi_amplicon*"]

[tool.setuptools.package-data]
q2_multi_amplicon = ["**/*"]
